# KirimCepat - Docker Compose (untuk deploy)
#
# * Image aplikasi diambil dari Docker Hub (hasil pipeline Jenkins), BUKAN build lokal.
#   Untuk uji lokal sebelum image ada di Docker Hub, pakai tambahan compose.local.yaml.
# * Semua nilai rahasia dibaca dari file .env (salin dari .env.example).

name: kirimcepat

services:
    app:
        image: ${DOCKERHUB_USER:?Isi DOCKERHUB_USER di file .env}/kirimcepat:${IMAGE_TAG:-latest}
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8000}:80"
        environment:
            APP_NAME: ${APP_NAME:-KirimCepat}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY:?Isi APP_KEY di file .env}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost:8000}
            LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?Isi DB_DATABASE di file .env}
            DB_USERNAME: ${DB_USERNAME:?Isi DB_USERNAME di file .env}
            DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
            RUN_SEEDERS: ${RUN_SEEDERS:-false}
        depends_on:
            db:
                condition: service_healthy
        networks:
            - frontend
            - backend
        healthcheck:
            # TODO: ganti /up menjadi /health setelah endpoint /health dari Tech Lead ter-merge
            test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 40s

    db:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?Isi DB_DATABASE di file .env}
            MYSQL_USER: ${DB_USERNAME:?Isi DB_USERNAME di file .env}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di file .env}
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - backend
        healthcheck:
            # -h 127.0.0.1 (TCP) sengaja dipakai agar tidak lolos saat server sementara proses init
            test:
                - CMD-SHELL
                - mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

networks:
    # Jalur ke luar (dipakai app agar port bisa dipublish ke host)
    frontend:
        driver: bridge
    # Jalur internal app <-> db: tidak punya akses keluar & tidak bisa dijangkau dari host
    backend:
        driver: bridge
        internal: true

volumes:
    db_data:
