<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # AllowOverride All supaya public/.htaccess (rewrite Laravel) berfungsi
        AllowOverride All
        Require all granted
    </Directory>

    # Log ke stdout/stderr agar muncul di `docker compose logs`
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
